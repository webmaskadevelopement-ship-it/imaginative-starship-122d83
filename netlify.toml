[build]
  publish = "."

[[redirects]]
  from = "/protein"
  to = "/protein-powder.html"
  status = 200

[[redirects]]
  from = "/protein-powder"
  to = "/protein-powder.html"
  status = 200

[[redirects]]
  from = "/protein.html"
  to = "/protein-powder.html"
  status = 200

[[redirects]]
  from = "/protien"
  to = "/protein-powder.html"
  status = 200

[[redirects]]
  from = "/protien-powder"
  to = "/protein-powder.html"
  status = 200

[[redirects]]
  from = "/protien.html"
  to = "/protein-powder.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
